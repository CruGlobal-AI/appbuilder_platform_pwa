name: Merging Rules
on:
   # Run on pull requests into the #master branch
   pull_request:
      branches: [master]

jobs:
   e2e-tests:
      uses: ./.github/workflows/e2e-test.yml
      with:
         app_id: ${{ vars.DS_GH_APP_ID }}
      secrets:
         app_secret: ${{ secrets.DS_GH_APP_PK }}
